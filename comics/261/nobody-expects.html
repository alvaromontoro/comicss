      @font-face {

body {
  overflow: hidden;
  background: #fc83;
}

article {
  /* for the demo */
  font-size: 1vmin;
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  /* demo only */
  width: 80em;
  aspect-ratio: 1;
/*   overflow: hidden; */
  
  *, *::before, *::after {
    position: absolute;
    box-sizing: border-box;
  }
  
  h1 {
    bottom: 5%;
    margin: 0;
    font-family: monospace, monospace;
    font-size: 6em;
    text-fit: grow per-line-all;
    width: 125%;
    scale: 1 1.1;
    font-weight: 900;
    left: 50%;
    translate: -50%;
    transform-origin: 50% 100%;
    text-align: center;
  }
  
  h2 {
    top: 5%;
    margin: 0;
    font-size: 8em;
    text-fit: grow per-line-all;
    width: 100%;
    font-family: Roboto, Helvetica, sans-serif;
    text-transform: uppercase;
    text-align: center;
    
    font-weight: 900;
/*     scale: 1 0.9 ; */
    
    span {
      --num: calc(sibling-index() - sibling-count() / 2 - 0.5);
      transform: translate(-50%, -50%) rotate(calc(var(--num) * 4deg));
      transform-origin: 50% 900%;
    }
  }
  
  section {
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
  
  .person {
    --color1: #d13;
    --color2: #b02;
    --color3: #900;
    --color4: #95c; #80b;
    --hair: #963;
    --skin: #fb9;
    
    .body {
      width: 36%;
      height: 42%;
      top: 60%;
      left: 50%;
      translate: -50% -50%;
      
      .chest {
        width: 95%;
        left: 50%;
        translate: -50%;
        height: 42%;
        top: 3%;
        background: 
          linear-gradient(55deg, #0000 50%, #0005 0 52%, #0000 0) 0 0 / 80% 100% no-repeat,
          linear-gradient(-55deg, #0000 31%, #0005 0 33%, #0000 0) 0 0 / 80% 100% no-repeat,
          var(--color1);
        border-radius: 55% / 120% 120% 0 0;
        
        &::before {
          content: "";
          width: 100%;
          height: 35%;
          background: var(--color1);
          border-radius: 50%;
          top: 100%;
          translate: 0 -50%;
        }
        
        &::after {
          content: "";
          width: 5em;
          height: 6em;
          background: 
            linear-gradient(#0000 30%, gold 0 50%, #0000 0),
            linear-gradient(90deg, #0000 38%, gold 0 62%, #0000 0);
          left: 51%;
          top: 70%;
          translate:-50% -20%;
        }
      }
      
      .lower {
        width: 70%;
        height: 40%;
        top: 40%;
        background: var(--color2);
        left: 50%;
        translate: -50%;
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 100% 150%, 0 150%, 0 100%);
        box-shadow: inset 0 6em 5em -3em #0008;
        
        &::before {
          content: "";
          width: 100%;
          height: 20%;
          background: inherit;
          border-radius: 50%;
          top: 100%;
          translate: 0 -50%;
        }
      }
      
      .arm {
        width: 34%;
        aspect-ratio: 1.2;
        background: var(--color3);
        border-radius: 50%;
        top: 39%;
        left: 25%;
        translate: -50% 0;
        
        & ~ & {
          left: 77%;
          
        }
      }
      
      .hand {
        width: 22%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--color4);
        left: 33%;
        top: 50%;
        translate: -50% -50%;
        
        & ~ & {
          left: 67%;
        }
      }
      
      .foot {
        bottom: 0;
        left: 40%;
        width: 17%;
        height: 25%;
        background: 
          linear-gradient(#0000 calc(100% - 1em), #0004 0),
          var(--color3);
        translate: -50%;
        border-radius: 0 0 0.5em 0;
        box-shadow: inset 0 4em 2em -1em #0008;
        
        &::before {
          content: "";
          width: 150%;
          right: 50%;
          height: 40%;
          background: inherit;
          bottom: 0;
          border-radius: 50% 100% 50% 1em / 100% 100% 0 1em;
        }
        
        & ~ & {
          left: 60%;
          scale: -1 1;
        }
      }
      
      .laptop {
        width: 58%;
        height: 30%;
        background: #bbb;
        top: 33%;
        left: 50%;
        translate: -50% -50%;
        clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
        border-radius: 1em;
        
        &::before {
          content: "";
          width: 8%;
          aspect-ratio: 1;
          background: #ccc;
          top: 45%;
          left: 50%;
          translate: -50% -50%;
          border-radius: 50%;
          box-shadow: 0 1.35em 0 0.5em #ccc;
        }
      }
    }
    
    .head {
      width: 18%;
      height: 18%;
      top: 34%;
      left: 50%;
      translate: -50% -50%;
      
      .hat {
        width: 110%;
        height: 80%;
        background: var(--color1);
        border-radius: 50%;
        corner-shape: squircle;
        top: 0%;
        left: 45%;
        rotate: -10deg;
        translate: -50% -50%;
      }
      
      .hat-wing {
        width: 200%;
        height: 90%;
        background: var(--color3);
        border-radius: 100% /  110% 120% 80% 90%;
        left: 50%;
        top: 18%;
        translate: -50% -50%;
        rotate: -10deg;
      }
      
      .ear {
        width: 30%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(#d003, #0000), var(--skin);
        top: 45%;
        left: 0;
        translate: -50%;
        
        & ~ & {
          left: 100%;
        }
      }
      
      .face {
        --h: radial-gradient(20% 50% at 0 0, var(--hair) calc(100% - 1px), #0000),
          radial-gradient(35% 45% at 100% 0, var(--hair) calc(100% - 1px), #0000),
          radial-gradient(60% 34% at 100% 0, var(--hair) calc(100% - 1px), #0000),
          radial-gradient(69% 55% at 60% 60%, #0000 calc(100% - 1px), var(--hair));
        inset: 0;
        background:
          var(--h),
          linear-gradient(#d003, #0000 80%),
          var(--skin);
        border-radius: 4em;
        
        @supports (corner-shape: squircle) {
          border-radius: 100% / 120% 120% 80% 80%;
          corner-shape: squircle;
        }
        
        .mustache {
          --p: 36%;
          width: 27%;
          height: 8%;
          background: var(--hair);
          border-radius: 100% 50% 50% 50% / 100% 50% 100% 0%;
          top: 74%;
          left: var(--p);
          translate: -50% -50%;
          rotate: -12deg;
          
          & ~ & {
            left: calc(100% - var(--p));
            scale: -1 1;
            rotate: 12deg;
          }
        }
        
        .beard {
          background: linear-gradient(#0000 40%, #0004), var(--hair);
          width: 35%;
          height: 25%;
          border-radius: 50%;
          corner-top-left-shape: scoop;
          corner-top-right-shape: scoop;
          top: 100%;
          left: 50%;
          translate: -50% -50%;
          clip-path: polygon(0 0, 100% 0, 100% 40%, 65% 95%, 58% 90%, 50% 100%, 43% 90%, 36% 95%, 0 40%);
        }
        
        .eyebrow {
          --p: 31%;
          width: 28%;
          height: 6%;
         
          top: 47%;
          left: var(--p);
          translate: -50% -50%;
          border-radius: 5em;
          rotate: 10deg;
          
          &::after {
            content: "";
            inset: 0;
            border-radius: 5em;
            background: var(--hair);
          }
          
          &::before {
            content: "";
            width: 1.5em;
            height: 1.5em;
            background: #000;
            left: 50%;
            border-radius: 50%;
            translate: -50% -50%;
            left: 50%;
            top: 135%;
          }
          
          & ~& {
            left: calc(100% - var(--p));
            scale: -1 1;
            rotate: -10deg;
          }
        }
      }
    }
  }
  
  .person-2 {
    left: -29%;
    filter: brightness(0.87);
    
    .body {
      .chest {
        height: 39%;

      }
      
      .hand {

        width: 20%;
        aspect-ratio: 0.7;
        left: 15%;

          left: 85%;
        }
      }
    }
    
    .head {
      translate: -50% calc(-50% + 1em);
      tranform-origin: 50% 100%;
      rotate: -2deg;
      filter: brightness(1.1);
      
      .hat-wing {
        width: 107%;
        border-radius: 0;
        height: 100%;
        rotate: 0deg;
        background: #0000;
        top: 24%;
        translate: -50% 0;
        
        &::before,
        &::after {
          content: "";
          width: 10%;
          height: 100%;
          background: #630;
          border-radius: 0 0 3em 3em;
        }
        
        &::after {
          right: 0;
          height: 90%;
        }
      }
      
      .hat {
        background: #630;
        width: 107%;
        height: 50%;
        border-radius: 50% / 100% 100% 0 0;
        corner-shape: round;
        top: 0%;
        left: 50%;
        rotate: 0deg;
        translate: -50% -50%;
        
        &::before {
          content: "";
          width: 100%;
          height: 30%;
          top: 100%;
          left: 50%;
          translate: -50% -50%;
          background: inherit;
          border-radius: 50%;
        }
      }
      .glasses {
        width: 107%;
        height: 30%;
        left: 50%;
        top: -5%;
        translate: -50%;
        
        &::before,
        &::after {
          content: "";
          width: 50%;
          height: 100%;
          border-radius: 55% / 10% 10% 100% 100%;
          border: 0.75em solid gold;
          transform-origin: 100% 10%;
          rotate: -5deg;
          left: 2%;
          background: 
            linear-gradient(45deg, #0000 33%, #fff2 0 40%, #0000 0 48%, #fff2 0 70%, #0000 0),
            #0006;
        }
        
        &::after {
          right: 2%;
          left: auto;
          transform-origin: 0 10%;
          rotate: 5deg;
        }
      }
      
      .ear {
        width: 35%;
      }
      
      .face {
        --h: linear-gradient(#0000 0 0);
/*         box-shadow: 0 5.8em 0 -4.85em var(--skin); */
        
        &::before {
          content: "";
          width: 40%;
          height: 20%;
          background: var(--skin);
          border-radius: 50%;
          top: 100%;
          left: 50%;
          translate: -50% -65%;
        }
        
        .mustache {
          --p: 25%;
          z-index: 1;
          width: 53%;
          height: 21.5%;
          top: 83%;
          border-radius: 80% / 200% 50% 100% 0;
        }
        
        .eyebrow {
          --p: 35%;
          rotate: -2deg;
          height: 9%;
          width: 37%;
          
          &::before {
            left: 45%;
          }
          
          & ~ & {
            rotate: 2deg;
          }
        }
      }
    }
  }
  
  .person-3 {
    left: 27%;
    filter: brightness(0.87);
    
    .head {
      translate: -50% calc(-50% + 1em);
      tranform-origin: 50% 100%;
      rotate: -6deg;
      filter: brightness(1.1);
      top: 37%;
      height: 21%;
      
      .ear {
        left: 5%;
        background: linear-gradient(#0003,#0000), var(--color2);
        
        &~& {
          left: 94%;
        }
      }
      
      .face {
        corner-shape: round;
        border-radius: 100% / 140% 140% 80% 80%;
        box-shadow: 
          inset 0 11em 0 -6em var(--color2),
          inset 0 -0.25em 0 0.5em var(--color2),
          0 3em 1em -2em #0004;
        
        .beard {
          width: 20%;
          corner-shape: round;
          clip-path: polygon(0 30%, 50% 0, 100% 30%, 50% 100%);
        }
        
        .eyebrow {
          height: 4%;
          rotate: 5deg;
          &~& {
            rotate: -9deg;
          }
        }
        
        .mustache {
          height: 3%;
          width: 18%;
          rotate: 0deg !important;
        }
      }
    }
    
    .body {
      .chest {
        height: 39%;
        top: 12%;
        border-radius: 50% / 60% 100% 0 0;
        
        &::after {
          top: 89%;
        }
      }
      
      .hand {
        scale: 0.9;
        lefT: 15%;
        top: 69%;
        &~& {
          left: 85%;
        }
      }
      
      .arm {
        border-radius: 0;
        width: 20%;
        aspect-ratio: 0.7;
        left: 15%;
        top: 42%;
        
        &~& {
          left: 85%;
        }
      }
    }
  }
}
