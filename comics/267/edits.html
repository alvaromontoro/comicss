    <style>
      @font-face {
        font-family: 'Patrick Hand SC';
        src: url(/fonts/PatrickHandSC.ttf);
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

article {
  width: 91.5em;
  font-size: 1vmin;
  display: grid;
  gap: 1.5em;
  grid-template-columns: 1fr 1fr;

  section {
    position: relative;
    border: 0.66em solid #000;
    aspect-ratio: 1;
    overflow: hidden;
    background: linear-gradient(#c9c6, #c9c0 50%);
/*     border-radius: 1em; */
    
    *, *::before, *::after {
      position: absolute;
      box-sizing: border-box;
    }

    svg {
      width: 45%;
      height: auto;
      left: 50%;
      translate: -50%;
      bottom: 12%;
    }

    .bubble {
      --string: radial-gradient(130% 150% at 100% 0, #0000 51%, #00f 0 56.5%, #0000 0) 20% 50% / 80% 80% no-repeat;
      --width: 60%;
      --height: 50%;
      --margin: 0.66em;
      --left: 20%;
      --top: 10%;
      width: var(--width);
      height: var(--height);
      top: var(--top);
      left: var(--left);
      font-family: 'Patrick Hand SC', 'Comic Neue', 'Comic Sans', 'Comic Sans MS', 'Amatic SC', Helvetica, Arial, sans-serif;
      font-size: 3em;
      /* display: grid; */
      text-align: center;
      box-sizing: border-box;
      padding-top: var(--margin);

      span { position: relative; top: 0.25em; }

      &::before {
        content: "";
        width: 200%;
        height: 80%;
        background: 
          radial-gradient(25% 22% at 25% 22%, #00f 99%, #ffc0),
          radial-gradient(18% 19% at 30% 22%, #00f 99%, #ffc0),
          var(--string),
          #fff;
        box-shadow: 0 0 0 1em #fff;
        filter: blur(0.3em) contrast(100) sepia(1) brightness(5) hue-rotate(140deg);
        mix-blend-mode: multiply;
        left: 0;
        top: 0;
      }
    }

    &:nth-of-type(1) {
      .bubble {
        --left: 20%;
        --width: 66%;
      }
      svg {
        filter: brightness(100%);
      }
    }

    &:nth-of-type(2) {
      .bubble {
        --left: 12%;
        --width: 70%;
        --string: radial-gradient(130% 140% at 100% 10%, #0000 50.5%, #00f 0 56.5%, #0000 0) 20% 50% / 80% 80% no-repeat;
        padding-inline-start: 0.65em;
        &::before {
          width: 220%;
        }
      }

      svg {
        filter: brightness(220%);
      }
    }

    &:nth-of-type(3) {
      .bubble {
        --left: 12%;
        --top: 5%;
        --width: 58%;
        --height: 73%;
        --string: radial-gradient(130% 110% at 100% 0%, #0000 50.5%, #00f 0 56.5%, #0000 0) 20% 50% / 80% 80% no-repeat;
        padding-inline-start: 1.75em;
        text-align: center;
        line-height: 1.1;

        &::before {
          background: 
          radial-gradient(28% 22% at 30% 22%, #00f 99%, #ffc0),
          radial-gradient(20% 19% at 30% 22%, #00f 99%, #ffc0),
          var(--string),
          #fff;
          width: 210%;
        }
      }

      svg {
        filter: brightness(40%);
      }
    }

    &:nth-of-type(4) {
      .bubble {
        --string: radial-gradient(150% 130% at 120% 5%, #0000 50%, #00f 0 56.5%, #0000 0) 20% 50% / 80% 80% no-repeat;

      }

      .logo.css {
        width: 44%;
        aspect-ratio: 22 / 25;
        background: lch(35.76% 89.61 293.02);
        clip-path: polygon(0 0, 100% 0, 90% 90%, 50% 100%, 10% 90%);
        bottom: 12%;
        left: 50%;
        transform: translate(-50%, 0%);

        &::after {
          content: "";
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
          background: #ffffff18;
          clip-path: polygon(50% 8%, 91% 8%, 83% 84%, 50% 92%);
          mix-blend-mode: plus-lighter;
        }

        &::before {
          content: "";
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
          background: hsl(0, 0%, 93%);
          clip-path: polygon(18.5% 18.5%, 81.5% 18.5%, 76% 74%, 50% 80.5%, 24% 74%, 22.25% 57%, 34.25% 57%, 35% 65.5%, 50% 69%, 65% 65.5%, 66% 51.5%, 22% 51.5%, 20.75% 40.5%, 66.5% 40.5%, 67.5% 29.5%, 19.5% 29.5%);
        }
      }
    }
  }
}
    </style>
