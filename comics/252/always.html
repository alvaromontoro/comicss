      article {
        position: relative;
        font-size: 1vmin;
        width: 80em;
        aspect-ratio: 1;
        
        *, *::before, *::after {
          box-sizing: border-box;
          position: absolute;
        }

        .arm {
          width: 1.125em;
          height: 21.5em;
          background: #000;
          border-radius: 5em;
          top: 66%;
          left: 17%;

          & ~ & {
            left: 46%;
          }

          &::before {
            content: "";
            width: 2.25em;
            height: 4em;
            background: #000;
            border-radius: 100% 0 0% 100% / 50%;
            right: 50%;
            bottom: 0%;
          }
        }

        .shadow {
          top: 16%;
          left: 27%;
          width: 76%;
          height: 21%;
          background: 
            radial-gradient(farthest-side at 51% 50%, #00f 99%, #0000 0),
            radial-gradient(20% 49% at 20% 48%, #00f 99%, #0000 0),
            radial-gradient(25% 50% at 75% 50%, #00f 99%, #0000 0),
            radial-gradient(15% 49% at 85% 49%, #00f 99%, #0000 0),
            #fff;
          box-shadow: 0 0 0 4em #fff;
          afilter: blur(2em) contrast(200) hue-rotate(-30deg) brightness(200);
          filter: blur(2em) contrast(14) sepia(9) brightness(5) hue-rotate(150deg);
          opacity: 10.5;
          mix-blend-mode: multiply;

          &::before {
            content: "";
            width: 34%;
            height: 130%;
            left: 33%;
            top: 98%;
            background: 
            radial-gradient(farthest-side at 0% 0%, #fff 52%, #00f 0 70%, #fff 0),
              #fff;
            box-shadow: -4em 4em #fff;
          }
        }

        .logo {
          top: 69%;
          left: 32%;
          translate: -50% -50%;
          width: 40em;
          aspect-ratio: 1;
          rotate: 3deg;
          font-size: 1.16em;

          svg {
            position: absolute;
            top: 35%;
            left: 50%;
            translate: -50% -50%;
            width: 24em;
            height: 24em;
          }

          .eye {
            --x: 55%;
            --y: 71%;
            --r: 30%;
            width: 14%;
            aspect-ratio: 2;
            background: #fff;
            border-radius: 50% / 0% 0% 90% 90%;
            top: 18%;
            left: 36%;
            rotate: -10deg;
            background:
              radial-gradient(circle at var(--x) var(--y), #000 var(--r), #c9f calc(var(--r) + 1px) calc(var(--r) + 10%), #fff7f7 calc(var(--r) + 10% + 1px));
            ;
            box-shadow: 
            0 -0.5em 0.25em 0.25em #0001,
            -0.5em 0.1em 0 0.25em #0002,
            -0.75em -0.1em 0.25em 0.3em #0001;
            

            & ~ & {
              --x: 58%;
              --y: 70%;
              --r: 29%;
              left: 55%;
              rotate: 10deg;
              box-shadow: 
                0 -0.5em 0.25em 0.25em #0001,
                0.5em 0.1em 0 0.25em #0002,
                 0.75em -0.1em 0.25em 0.25em #0001;
            }
          }

          .mouth {
            width: 10%;
            aspect-ratio: 2;
            top: 29%;
            left: 52%;
            rotate: 10deg;
            translate: -50% -50%;
            border-radius: 50% / 100% 100% 0 0;
            background: #000;
            background: 
              radial-gradient(at 40% 100%, #c66 30%, #400 0);
          }

          .tear {
            width: 4%;
            aspect-ratio: 1;
            top: 27.5%;
            left: 38%;
            scale: 1 1.2;
            
            &::before {
              content: "";
              inset: 0;
              background: #0ffa;
              rotate: 43deg;
              border-radius: 0 50% 50% 50%;
            }
          }
        }

        .leg {
          width: 10%;
          height: 25%;
          border-radius: 40% / 100%;
          box-shadow: 1.5em -0.5em #000;
          top: 74.25%;
          left: 15%;
          transform: skew(-8deg);

          & ~ & {
            left: 27%;
            transform: skew(7deg);

            &::before {
              left: 86%;
            }
          }

          &::before {
            content: "";
            width: 110%;
            height: 14%;
            background:#000;
            border-radius: 50% / 100% 100% 0 0;
            bottom: 0;
            left: 85%;
          }
        }


        p.joke {
          text-align: center;
          font-size: 6em;
          white-space: pre;
          line-height: 1;

          code {

          span {

            top: 0.25em;
          }

          &:first-child {
            top: 0;
            left: 50%;
            translate: -50%;
          }
          
          &:last-child {
            top: 20%;
            left: 65%;
            translate: -50%;
          }
        }
      }
