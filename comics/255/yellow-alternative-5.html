    <style>
      @font-face {
        font-family: 'Patrick Hand Regular';
        src: url(/fonts/PatrickHand-Regular.ttf);
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      #desc {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      article {
        font-family: 'Patrick Hand Regular', Helvetica, Arial, sans-serif;
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        font-size: 1vmin;
        width: 90em;
        aspect-ratio: 3/1;
      }

      article *, article *::before, article *::after {
        position: absolute;
        box-sizing: border-box;
      }

      .shadow {
        width: 14%;
        height: 5%;
        background: #eee;
        border-radius: 50%;
        bottom: 1.5%;
      }

      .cup-container-1 .shadow {
        left: 13%;
      }
      .cup-container-2 .shadow {
        left: 32.25%;
      }
      .cup-container-3 .shadow {
        left: 53.25%;
      }
      .cup-container-4 .shadow {
        left: 74%;
      }

      .cup {
        --color: #ff0;
        position: absolute;
        width: 12%;
        aspect-ratio: 3/4;
        border-radius: 100% / 25% 25% 40% 40%;
        border: 0.35em solid #000;
        clip-path: polygon(0 0, 100% 0, 100% 5%, 85% 100%, 15% 100%, 0 5%);
        background:
          radial-gradient(105% 20% at 50% 8%, #0000 0 45%, #000 calc(45% + 1px) calc(45% + 1px + 0.4em), #0000 calc(45% + 2px + 0.4em)),
          radial-gradient(75% 15% at 50% 97%, #0000 0 45%, #0002 calc(45% + 1px) calc(45% + 1px + 0.4em), #0000 calc(45% + 2px + 0.4em)),
          linear-gradient(-83.5deg, #000 12.5%, #0000 calc(12.5% + 1px)),
          linear-gradient(83.5deg, #000 12.5%, #0000 calc(12.5% + 1px)),
          #f0f8ff
          ;
          bottom: 18%;
      }

      .cup::before {
        z-index: -16;
        content: "";
        position: absolute;
        width: 90%;
        height: 50%;
        left: 50%;
        translate: -50% 0;
        bottom: 2.5%;
        border-radius: 100% / 64%;
        clip-path: polygon(6% 0, 94% 0, 94% 5%, 85% 100%, 15% 100%, 6% 5%);
        background:
        radial-gradient(100% 50% at 50% 8%, #fff6 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.2em), #0000 calc(45% + 2px + 0.2em)),
        radial-gradient(90% 50% at 50% 105%, #0000 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.2em), #0000 calc(45% + 2px + 0.2em)),
          var(--color)
          ;
      }

      .cup::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 100% / 25% 25% 40% 40%;
        clip-path: polygon(95.5% 16%, 88% 68%, 83% 68%, 91.5% 16%);
        background:
          repeating-radial-gradient(60% 20% at 50% 0%, #0000 0 14%, #0003 0 17%);
          ;
      }

      .cup-1 {
        left: 14%;
        --color: #fe2;
        rotate: -1deg;
      }

      .cup-1::before {
        height: 60%;
        border-radius: 100% / 44% 44% 60% 60%;
        clip-path: polygon(5% 0, 95% 0, 95% 5%, 85% 100%, 15% 100%, 5% 5%);
        background:
        radial-gradient(100% 40% at 50% 5%, #fff6 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.1em), #0000 calc(45% + 2px + 0.1em)),
        radial-gradient(90% 50% at 50% 107%, #0000 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.2em), #0000 calc(45% + 2px + 0.2em)),
          var(--color)
          ;
      }

      .cup-2 {
        left: 33%;
        --color: #ff0;
      }

      .cup-2::before {
        height: 75%;
        border-radius: 100% / 34% 34% 50% 50%;
        clip-path: polygon(3% 0, 97% 0, 97% 5%, 85% 100%, 15% 100%, 3% 5%);
        background:
        radial-gradient(100% 30% at 50% 5%, #fff8 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.1em), #0000 calc(45% + 2px + 0.1em)),
        radial-gradient(95% 50% at 50% 110%, #0000 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.2em), #0000 calc(45% + 2px + 0.2em)),
          var(--color)
          ;
      }

      .cup-3 {
        left: 54%;
        --color: #ee3;
      }

      .cup-4 {
        left: 75%;
        --color: #fe2;
        rotate: 3deg;
      }

      .cup-4::before {
        height: 67%;
        border-radius: 100% / 44% 44% 60% 60%;
        clip-path: polygon(4% 0, 96% 0, 96% 5%, 85% 100%, 15% 100%, 4% 5%);
        background:
        radial-gradient(100% 40% at 50% 5%, #fff6 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.1em), #0000 calc(45% + 2px + 0.1em)),
        radial-gradient(95% 50% at 50% 109%, #0000 0 45%, #00000008 calc(45% + 1px) calc(45% + 1px + 0.2em), #0000 calc(45% + 2px + 0.2em)),
          var(--color)
          ;
      }

      .eyes {
        width: 40%;
        height: 7%;
        top: 65%;
        left: 50%;
        translate: -50% -50%;
        display: flex;
        justify-content: space-between;
      }

      .eyes::before, .eyes::after {
        content: "";
        position: relative;
        height: 100%;
        width: auto;
        aspect-ratio: 1/1;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 34%, #fff 20%, #0000 0) #000;
      } 

      .mouth {
        width: 20%;
        aspect-ratio: 2;
        background: #000;
        border-radius: 15% 15% 50% 50% / 15% 15% 90% 90%;
        top: 74%;
        left: 50%;
        translate: -50% -50%;
        border: 0.25em solid #000;
      }

      .cup-2 .mouth {
        background:
          radial-gradient(80% 50% at 50% 100%, red 40%, #000 0);
      }

      .cup-3 .mouth {
        background:
          linear-gradient(#fff 40%, #000 0)
      }

      .cup-4 .mouth {
        top: 72.5%;
        background:
          radial-gradient(80% 60% at 50% 100%, #f00 50%, #400 0);
      }
      
      .cup-4 .eyes::before, .cup-4 .eyes::after {
        content: "";
        background: #0000;
        border: 0.25em solid #000;
        height: 120%;
        clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        rotate: 5deg;
      }

      .cup-4 .eyes::before {
        rotate: -5deg;
      }

      .leg {
        --angle: 0deg;
        width: 4em;
        height: 20%;
        bottom: 4%;
        border-radius: 40% / 100%;
        border-right: 0.5em solid #000;
        rotate: var(--angle);
        transform-origin: 100% 100%;

        &::before {
          content: "";
          width: 40%;
          aspect-ratio: 3;
          border-radius: 50% / 100% 100% 0 0;
          background: #000;
          bottom: 0%;
          right: 0%;
          translate: 80%;
          transform-origin: 0 100%;
          rotate: calc(var(--angle) * -1);
        }
      }

      .cup-1-leg {
        left: 18%;
        --angle: -5deg;

        & ~ & {
          left: 13.5%;
          scale: -1 1;
          --angle: 5deg;
        }
      }

      .cup-2-leg {
        left: 36.5%;
        --angle: 0deg;

        & ~ & {
          left: 33%;
          scale: -1 1;
        }
      }
      .cup-3-leg {
        left: 58.5%;
        --angle: -10deg;

        & ~ & {
          left: 53%;
          scale: -1 1;
          --angle: 10deg;
          &::before {
            rotate: 10deg;
          }
        }
      }

      .cup-4-leg {
        left: 79.5%;
        --angle: -15deg;

        &::before {
          rotate: -2deg;
        }

        & ~ & {
          left: 73%;
          scale: -1 1;
          --angle: 15deg;
          &::before {
            rotate: 0deg;
          }
        }
      }

      .speech {
        font-size: 2em;

        &::before {
          content: "";
          width: 2em;
          height: 3em;
          border-radius: 0 0 0 100%;
          border-top: 0;
          border: 0.125em solid #0000;
          border-top :0;
          border-left: 0.125em solid #000;
          top: 90%;
          left: 50%;
        }
      }

      .speech span {
        position: relative;
        font-size: 1.35em;
      }

      .cup-1-speech {
        top: 11%;
        left: 9%;
        top: 7%;

        &::before {
          width: 5em;
        }
      }

      .cup-2-speech {
        top: 7%;
        left: 30%;
        top: 3%;
      }

      .cup-3-speech {
        top:7%;
        left: 60%;
        top: 3%;

        &::before {
          scale: -1 1;
          left: 0;
        }
      }

      .cup-4-speech {
        top: 5%;
        left: 83%;
        font-weight: bold;
        top: 1%;

        &::before {
          top: 110%;
          scale: -1.4 1.2;
          left: 0;
        }
      }

      .cup-container {
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }

      .cup-container-1 {
        left: 4%;
      }
      .cup-container-2 {
        left: 2%;
      }
      .cup-container-3 {
        left: -2%;
      }
      .cup-container-4 {
        left: -4%;
      }

      .arm {
        --w: 0.35em;
        --c: calc(100% - var(--w) * 1.2);
        width: 2em;
        height: 4em;
        bottom: 15%;

        & ~ & {
          scale: -1 1;
        }

        &::before {
          
          content:"";
          inset: 0;
          border: var(--w) solid #000;
          border-radius: 100% 0 0 0;
          clip-path: polygon(0 0, var(--c) 0, var(--c) var(--c), 0 var(--c));
        }

        &::after {
          content: "";
          width: 0;
          bottom: 0;
          width: calc(var(--w) * 3);
          height: calc(var(--w) * 3);
          border-radius: 50%;
          background: #000;
          transform: translate(calc(-50% + var(--w)), 50%);
        }
      }

      .cup-1-arm {
        left: 14%;
        rotate: 0deg;

        & ~ & {
          left: 24%;
          bottom: 16%;
          rotate: -10deg;
        }
      }

      .cup-2-arm {
        left: 32%;
        rotate: 150deg;
        scale: -1 1;
        bottom: 24%;

        & ~ & {
          left: 43%;
          bottom: 15%;
          rotate: -6deg;
        }
      }

      .cup-3-arm {
        left: 53.5%;
        rotate: 15deg;
        
        & ~ & {
          left: 64.5%;
          bottom: 15%;
          rotate: -20deg;
        }
      }

      .cup-4-arm {
        left: 73.5%;
        rotate: 140deg;
        scale: -1 1;
        bottom: 24%;

        & ~ & {
          scale: 1 1;
          left: 85.5%;
          bottom: 23%;
          rotate: -140deg;
        }
      }

      .lid {
        width: 12.5%;
        aspect-ratio: 2/1;
        border-radius: 100% / 50%;
        border: 0.35em solid #000;
        bottom: 51%;
        background:
          radial-gradient(55% 35% at 50% 5%, #f0f8ff 0 calc(99% - 0.3em - 1px), #000 calc(99% - 0.3em) calc(100% - 1px), #0000),
          repeating-linear-gradient(90deg, #0000 0 2%, #0001 0 4%),
          #f0f8ff
          ;
      }

      .cup-container-1 .lid {
        left: 13.66%;
        bottom: 50%;display: none;
      }
      .cup-container-2 .lid {
        left: 32.75%;display: none;
      }
      .cup-container-3 .lid {
        left: 53.75%;
        display: none;
      }

      .cup-container-4 .lid {
        left: 75.1%;
        rotate: 3deg;
        
      }
    </style>
  </head>
  <body>

    <article aria-labelledby="desc">
      <span id="desc">cartoon with four cups filled with a yellow liquid, all look really happy (specially the last one). The first one says 'I am #fe2!' The second one says 'I am #ff0!' The third one says 'I am #ef3!' And the last one says 'I am #pee!!!'</span>
      <div class="cup-container cup-container-1">
        <div class="shadow"></div>
        <div class="leg cup-1-leg"></div>
        <div class="leg cup-1-leg"></div>
        <div class="arm cup-1-arm"></div>
        <div class="arm cup-1-arm"></div>
        <div class="cup cup-1">
          <div class="eyes"></div>
          <div class="mouth"></div>
        </div>
        <div class="lid"></div>
        <div class="speech cup-1-speech">I am <span>#</span>FE2!</div>
      </div>
      <div class="cup-container cup-container-2">
        <div class="shadow"></div>
        <div class="leg cup-2-leg"></div>
        <div class="leg cup-2-leg"></div>
        <div class="arm cup-2-arm"></div>
        <div class="arm cup-2-arm"></div>
        <div class="cup cup-2">
          <div class="eyes"></div>
          <div class="mouth"></div>
        </div>
        <div class="lid"></div>
        <div class="speech cup-2-speech">I am <span>#</span>FF0!</div>
      </div>
      <div class="cup-container cup-container-3">
        <div class="shadow"></div>
        <div class="leg cup-3-leg"></div>
        <div class="leg cup-3-leg"></div>
        <div class="arm cup-3-arm"></div>
        <div class="arm cup-3-arm"></div>
        <div class="cup cup-3">
          <div class="eyes"></div>
          <div class="mouth"></div>
        </div>
        <div class="lid"></div>
        <div class="speech cup-3-speech">I am <span>#</span>EF3!</div>
      </div>
      <div class="cup-container cup-container-4">
        <div class="shadow"></div>
        <div class="leg cup-4-leg"></div>
        <div class="leg cup-4-leg"></div>
        <div class="arm cup-4-arm"></div>
        <div class="arm cup-4-arm"></div>
        <div class="cup cup-4">
          <div class="eyes"></div>

    </article>
