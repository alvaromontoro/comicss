    <style>
      @font-face {
        font-family: 'Patrick Hand SC';
        src: url(/fonts/PatrickHandSC.ttf);
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      css-panel {
        grid-column: 1 / -1;
        aspect-ratio: auto;
        width: 85em;
        height: 33.33em;
      }

      css-person {
        scale: 0.9;

        &[facing="left"] {
          scale: -0.9 0.9 !important;
        }
      }

      [character="jill"] {
        left: 3em;
      }

      [character="al"] {
        left: 26em;
      }

      [character="john"] {
        top: 23%;;
        left: 47em;
      }
      [character="sia"] {
        left: 68em;
      }
      [character="steve"] {
        left: 88em;

        .head {
          .face {
            border-radius: 5em 5em 3em 3em;
          }
        }
      }

      css-prop[type="table"] {
        bottom: 0;
        right: 0;
        width: 88%;
        height: 3em;
        background:
          /* repeating-linear-gradient(-45deg, #000 0 0.2em, #fff 0 0.4em) 0 0 / 100% 1.25em repeat-x, */
         white;
        border-left: 0.3em solid black;
        border-top: 0.3em solid black;
        position: absolute;
        z-index: 9;

        &::before {
          content: "";
          width: 101%;
          height: 1.5em;
          border: 0.3em solid black;
          border-right: 0;
          position: absolute;
          top: -0.75em;
          right: 0;
          background: #ddd;
        }
      }
      css-prop[type="chair"],
      css-prop[type="laptop"] {
        scale: 0.8 !important;
      }

      css-prop[type="laptop"][left="70"] {
        &::before {
          transform: skew(-10deg)
        }
      }

      css-panel a {
        outline: 5px auto rgba(0, 150, 255, 1);
        /* Use a border to apply the outline */
        border: 1px solid rgba(0, 0, 0, 0);
        padding: 0.5em 0.75em;
        font-size: 1.5em;
        top: 1.5em;
        left: 1.5em;
      }

      css-panel:nth-of-type(1) {

      }

      css-panel:nth-of-type(2) {
        [character="john"] {
          rotate:2deg;
          translate: 1em;
        }
        [character="al"] {
          .body {
            .hand {
              scale: 0.9;
              left: 155%;
              top: 40%;
            }
          }
        }
      }

      css-panel:nth-of-type(3) {
        [character="jill"] {
          .head {
            .eye {
              translate: 25% -30%;
            }
          }
        }
        [character="john"] {
          rotate: -2deg;
          .head {
            rotate: -4deg;
            left: 46%;
          }
        }
        [character="sia"] {
          .head {
            rotate: -4deg;
            left: 46%;
          }
        }

        [character="al"] {
          .body {
            .hand {
              scale: 0.9;
              left: 167%;
              top: 43%;
            }
          }
        }

        [character="steve"] {
          rotate:-1deg;
        }
      }

      css-panel:nth-of-type(4) {
        
      }
    </style>
  </head>

      <css-panel>

        <css-prop type="chair" top="60" style="left:29%"></css-prop>
