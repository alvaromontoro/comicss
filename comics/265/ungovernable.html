    <style>
      css-panel h2 {
        font-size: 2.5em;
        font-weight: 200;
        letter-spacing:-0.025em;
        top: 5%;
        left: 50%;
        translate: -50% -50%;
      }
      
      css-panel:not(:nth-of-type(3)) {
        css-speech[type="screen-message"] {
          width: 90%;
          top: 10%;
          text-align: left;
          padding: 1.5em;

          &::before {
            transform: skew(-5deg);
            height: 9em !important;
          }

          &::after {
            width: 7em;
            height: 3.5em;
            background: 
            radial-gradient(circle at 25% 50%, #ddd 1.25em, #0000 0),
            radial-gradient(circle at 25% 50%, #000 0.5em, #0000 1.5em),
             #666;
            content: "OFF";
            border-radius: 4em;
            right: 0;
            top: 50%;
            translate: -3em -50%;
            padding: 0em 0.75em;
            font-size: 0.5em;
            display: flex;
            align-items: center;
            color: #000;
            font-weight: 900;
          }
        }

        &:nth-of-type(1) {
          css-speech[type="screen-message"]::after {
            content: "ON" !important;
            padding: 0em 1.2em;
            justify-content: end;
            background: 
              radial-gradient(circle at 75% 50%, #ddd 1.25em, #0000 0),
              radial-gradient(circle at 75% 50%, #000 0.5em, #0000 1.5em),
              #9c5;
          }
        }

      }
      css-panel:last-of-type {
        .mouth {
          clip-path: polygon(0 10%, 100% 40%, 100% 100%, 0 100%); 
        }
      }
    </style>
