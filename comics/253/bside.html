    <style>
      @font-face {
        font-family: 'Patrick Hand SC';
        src: url(/fonts/PatrickHandSC.ttf);
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html {
  --bg: #dca;
  background: var(--bg);
}

div {
  --color: #444;
  --colordark: #333;
  --colorlight: #666;
  --bgdark: #0003;
  --bglight: #fff2;
  rotatE: 4deg;
  font-size: 0.5vmin;
  width: 80em;
  height: 50em;
  border-radius: 2em 2em 1em 1em / 1.5em 1.5em 2em 2em;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  overflow: hidden;
  box-shadow:
    inset -0.25em 0.5em 0em var(--bglight),
    inset -0.75em 0.75em 1em var(--colorlight),
    inset 0.75em -0.75em 1em var(--colordark),
    -18em 11em 0 -17.5em var(--colordark),
    18em 11em 0 -17.5em var(--colordark),
    -1em 8em 7em -3em #2229;
  background:
    linear-gradient(to right, var(--colorlight) 0.25%, transparent 0 99%, var(--colordark)) 4em 4em / 72em 33em,
    linear-gradient(var(--colordark), var(--color) 1.5% 99.75%, var(--colorlight) 0) 4em 4em / 72em 33em,
    /* screws lines */
    linear-gradient(black, black) 2.6em 2em / 0.4em 1.6em,
    linear-gradient(black, black) 1.9em 2.6em / 1.6em 0.4em,
    linear-gradient(black, black) 77.25em 2em / 0.4em 1.6em,
    linear-gradient(black, black) 76.6em 2.6em / 1.6em 0.4em,
    linear-gradient(black, black) 3em 46.25em / 0.4em 1.6em,
    linear-gradient(black, black) 2.3em 46.85em / 1.6em 0.4em,
    linear-gradient(black, black) 76.75em 46.25em / 0.4em 1.6em,
    linear-gradient(black, black) 76.25em 46.85em / 1.6em 0.4em,
    /* screws */
    radial-gradient(closest-side, #282828 60%, #222 0 90%, transparent 0) 1.5em 1.5em / 2.5em 2.5em,
    radial-gradient(closest-side, #282828 60%, #222 0 90%, transparent 0) 76em 1.5em / 2.5em 2.5em,
    radial-gradient(closest-side, #282828 60%, #222 0 90%, transparent 0) 2em 46em / 2.5em 2.5em,
    radial-gradient(closest-side, #282828 60%, #222 0 90%, transparent 0) 75.5em 46em / 2.5em 2.5em,
    
    repeating-linear-gradient(transparent 0 0.75%, var(--bgdark) 1.5%)
    ;
  background-repeat: no-repeat;
  background-color: var(--color);
}

div::before {
  content: "";
  box-sizing: border-box;
  display: block;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translate(-50%, -12em);
  width: 55em;
  height: 30em;
  border-radius: 5% / 50%;
  box-shadow:
    inset -0.25em 0.5em 0em var(--bglight),
    inset 0 -30em 1em -18em var(--colordark),
    inset -0.5em 0.5em 1em var(--colorlight),
    inset 0 -0.75em 1em var(--colordark),
    inset 0.5em 0em 1em var(--bgdark),
    
    -0.5em 0em 1em var(--colordark)
    ;
  background:
    radial-gradient(closest-side, var(--colordark) 40%, #222 99%, transparent 0) 6.5em 7.5em / 3.75em 3.75em,
    radial-gradient(50% 70% at 50% 50%, var(--colordark) 40%, #222 99%, transparent 0) 13.5em 5.5em / 3.25em 2.5em,
    radial-gradient(closest-side, var(--colordark) 40%, #222 99%, transparent 0) 44.75em 7.5em / 3.75em 3.75em,
    radial-gradient(50% 70% at 50% 50%, var(--colordark) 40%, #222 99%, transparent 0) 38.75em 5.5em / 3.25em 2.5em,
    
    radial-gradient(closest-side, #282828 60%, #222 0 90%, transparent 0) 50% 10% / 2.5em 2.5em,
    repeating-linear-gradient(transparent 0 2%, var(--bgdark) 3%)
    ;
  background-color: var(--color);
  background-repeat: no-repeat;
}

div::after {
  content: "";
  color: red;
  display: block;
  position: absolute;
  left: 5em;
  top: 5em;
  width: 70em;
  height: 30em;
  border-radius: 2em;
  background:
    /* tracks */
    radial-gradient(farthest-side, var(--bg) 45%, transparent 0 65%, white 0 70%, #ddd 85%, transparent 0 99.9%, var(--color) 0) 13em 12em / 11em 11em,
    linear-gradient(white, white) 18em 13.75em / 1em 7.5em,
    linear-gradient(30deg, transparent 45%, white 0% 55%, transparent 0) 15em 14em / 7em 7em,
    linear-gradient(-30deg, transparent 45%, white 0% 55%, transparent 0) 15em 14em / 7em 7em,
    radial-gradient(closest-side, var(--bg) 99.9%, transparent 0) 14.5em 13.5em / 8em 8em,
    linear-gradient(45deg, var(--colorlight), var(--colordark)) 13em 12em / 11em 11em,
    radial-gradient(farthest-side, var(--bg) 45%, transparent 0 65%, white 0 70%, #ddd 85%, transparent 0 99.9%, var(--color) 0) 46em 12em / 11em 11em,
    linear-gradient(white, white) 51em 13.75em / 1em 7.5em,
    linear-gradient(30deg, transparent 45%, white 0% 55%, transparent 0) 48em 14em / 7em 7em,
    linear-gradient(-30deg, transparent 45%, white 0% 55%, transparent 0) 48em 14em / 7em 7em,
    radial-gradient(closest-side, var(--bg) 99.9%, transparent 0) 47.5em 13.5em / 8em 8em,
    linear-gradient(45deg, var(--colorlight), var(--colordark)) 46em 12em / 11em 11em,
    
    /* window */
    repeating-linear-gradient(to right, transparent 0 16%, #0001 0, #fff4 20%) 27.5em 17em / 13em 4em,
    linear-gradient(#da33, #da33) 26em 12.5em / 18em 10em,
    radial-gradient(circle at -100% 50%, brown, maroon, brown, maroon, brown 78%, transparent 0) 26em 12.5em / 18em 10em,
    radial-gradient(circle at 150% 50%, brown, maroon, brown, maroon, brown 40%, var(--bg) 0) 26em 12.5em / 18em 10em,
    
    /* ,lines and b letter */
    linear-gradient(70deg, transparent 40%, white 0 50%, transparent 0) 4em 3.25em / 6em 4.5em,
    linear-gradient(-70deg, transparent 40%, white 0 50%, transparent 0) 1.33em 3.25em / 6em 4.5em,
    
    linear-gradient(transparent 40%, white 0 50%, transparent 0) 4.5em 3.25em / 2.5em 7em,
    linear-gradient(#222, #222) 2em 2em / 7em 7em,
    linear-gradient(black 4%, transparent calc(4% + 1px) calc(96% - 1px), black 96%) 10em 3.5em / 55em 4em,
    linear-gradient(var(--color), var(--color)) 12em 11em / 46em 13em
    ;
  background-repeat: no-repeat;
  background-color: white;
  box-sizing: border-box;
  font-family: 'Architects Daughter', Arial, sans-serif;
  font-weight: bold;
  font-size: 1em;
  padding: 2.25em 0 2.75em 12em;
}


p, code {
  font-family: 'Architects Daughter', 'Patrick Hand SC', Arial, sans-serif;
  margin: 0;
  font-size: 4vmin;
  white-space: pre;
}

p:first-child {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% calc(-24vmin - 50%);
}

p:nth-child(2) {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% calc(24vmin - 50%);
}
